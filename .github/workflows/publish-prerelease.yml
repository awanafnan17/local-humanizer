name: Publish Prerelease from Existing Artifacts

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Workflow run ID containing built installer artifacts"
        required: true
        default: "44890685142"
        type: string
      tag:
        description: "Prerelease tag name (e.g. v0.1.0-rc.1)"
        required: true
        default: "v0.1.0-rc.1"
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Publish Prerelease (${{ inputs.tag }})
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ inputs.run_id }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download existing CI installer artifacts
        run: |
          set -euo pipefail
          rm -rf raw-artifacts release-assets
          mkdir -p raw-artifacts release-assets
          gh run download "$RUN_ID" \
            --repo "${{ github.repository }}" \
            --dir raw-artifacts
          find raw-artifacts -type f -name 'LocalHumanizer-*' -exec mv {} release-assets/ \;
          ls -lh release-assets
          for f in LocalHumanizer-Windows-Setup.exe LocalHumanizer-macOS.dmg LocalHumanizer-macOS-x64.dmg; do
            test -f "release-assets/$f"
            sz="$(stat -c '%s' "release-assets/$f")"
            echo "$f size=$sz bytes"
            test "$sz" -gt 1000000000
          done

      - name: Compute and verify SHA256SUMS.txt
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum \
            LocalHumanizer-Windows-Setup.exe \
            LocalHumanizer-macOS.dmg \
            LocalHumanizer-macOS-x64.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          if [ "$RUN_ID" = "44890685142" ]; then
            grep -q "^1a56b2df673b81da5fdb9dfd11e55f82c7ed6be446ea4e0aa176b8777bce3807  LocalHumanizer-Windows-Setup.exe$" SHA256SUMS.txt
            grep -q "^66d0836df05362e5ec8bbd35176207313e3f2972fd50d10bce048da38caff391  LocalHumanizer-macOS.dmg$" SHA256SUMS.txt
            grep -q "^a4f000885772a269a262ce5f2e6297ba7c07d9b72e7ab64744301feb353cf816  LocalHumanizer-macOS-x64.dmg$" SHA256SUMS.txt
            echo "Verified exact Run 44890685142 SHA-256 digests."
          fi

      - name: Generate prerelease notes
        run: |
          set -euo pipefail
          WIN_SIZE="$(stat -c '%s' release-assets/LocalHumanizer-Windows-Setup.exe)"
          ARM_SIZE="$(stat -c '%s' release-assets/LocalHumanizer-macOS.dmg)"
          X64_SIZE="$(stat -c '%s' release-assets/LocalHumanizer-macOS-x64.dmg)"
          WIN_SHA="$(awk '/LocalHumanizer-Windows-Setup\.exe$/ {print $1}' release-assets/SHA256SUMS.txt)"
          ARM_SHA="$(awk '/LocalHumanizer-macOS\.dmg$/ {print $1}' release-assets/SHA256SUMS.txt)"
          X64_SHA="$(awk '/LocalHumanizer-macOS-x64\.dmg$/ {print $1}' release-assets/SHA256SUMS.txt)"
          BUILD_SHA="$(gh run view "$RUN_ID" --repo "${{ github.repository }}" --json headSha -q .headSha 2>/dev/null || echo "${GITHUB_SHA}")"
          cat > release-notes.md <<EOF
          # Local Humanizer ${TAG} (Prerelease)

          Free, privacy-first, 100% offline AI writing and paraphrasing desktop application for Windows and macOS.
          Built with Tauri v2 (Rust), React 19 + TypeScript + Tailwind CSS v4, bundled \`llama.cpp\` (\`b12600\`), and bundled quantized GGUF model \`Qwen3-1.7B-Q4_K_M.gguf\` (Apache-2.0).

          ## Source & Build Traceability

          - **Installer binaries built at commit:** \`${BUILD_SHA}\`
          - **GitHub Actions Release build run:** https://github.com/${{ github.repository }}/actions/runs/${RUN_ID}
          - **Release tag (\`${TAG}\`) commit:** \`${GITHUB_SHA}\`

          ## Release Assets

          | File | Platform / Arch | Size (bytes) | SHA-256 |
          |---|---|---:|---|
          | \`LocalHumanizer-Windows-Setup.exe\` | Windows 10/11 (\`x86_64\` NSIS) | ${WIN_SIZE} | \`${WIN_SHA}\` |
          | \`LocalHumanizer-macOS.dmg\` | macOS Apple Silicon (\`arm64\`) | ${ARM_SIZE} | \`${ARM_SHA}\` |
          | \`LocalHumanizer-macOS-x64.dmg\` | macOS Intel (\`x86_64\`) | ${X64_SIZE} | \`${X64_SHA}\` |
          | \`SHA256SUMS.txt\` | Checksums | — | Verified with \`sha256sum -c\` |

          ## Platform & Signing Notes

          - **macOS Apple Silicon (\`arm64\`):** Ad-hoc signed locally / in CI (not Apple Developer ID notarized; Gatekeeper requires explicit allowance via right-click -> Open or \`xattr -dr com.apple.quarantine\`).
          - **Windows (\`x86_64\`) & Intel macOS (\`x86_64\`):** Built via GitHub Actions matrix for \`${BUILD_SHA}\`; Windows NSIS installer is unsigned (SmartScreen prompt expected). See [INSTALLATION.md](https://github.com/${{ github.repository }}/blob/main/INSTALLATION.md).

          ## Documentation

          - [INSTALLATION.md](https://github.com/${{ github.repository }}/blob/main/INSTALLATION.md)
          - [SECURITY.md](https://github.com/${{ github.repository }}/blob/main/SECURITY.md)
          - [THIRD_PARTY_NOTICES.md](https://github.com/${{ github.repository }}/blob/main/THIRD_PARTY_NOTICES.md)
          EOF
          python3 -c '
          from pathlib import Path
          p = Path("release-notes.md")
          lines = [ln[10:] if ln.startswith("          ") else ln for ln in p.read_text().splitlines()]
          p.write_text("\n".join(lines) + "\n")
          '
          cat release-notes.md

      - name: Create or update GitHub Prerelease
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              --repo "${{ github.repository }}" \
              --clobber \
              release-assets/LocalHumanizer-Windows-Setup.exe \
              release-assets/LocalHumanizer-macOS.dmg \
              release-assets/LocalHumanizer-macOS-x64.dmg \
              release-assets/SHA256SUMS.txt
            gh release edit "$TAG" \
              --repo "${{ github.repository }}" \
              --prerelease \
              --title "Local Humanizer ${TAG} (Prerelease)" \
              --notes-file release-notes.md
          else
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --prerelease \
              --target "${GITHUB_SHA}" \
              --title "Local Humanizer ${TAG} (Prerelease)" \
              --notes-file release-notes.md \
              release-assets/LocalHumanizer-Windows-Setup.exe \
              release-assets/LocalHumanizer-macOS.dmg \
              release-assets/LocalHumanizer-macOS-x64.dmg \
              release-assets/SHA256SUMS.txt
          fi
